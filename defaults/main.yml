flush_all: False

pihole_service_name: pihole
pihole_docker_image: pihole/pihole:2022.10

pihole_network: bridge
pihole_host_pihole_dir: /etc/pihole/pihole
pihole_host_dnsmasq_dir: /etc/pihole/dnsmasq.d
pihole_host_memory: 64m

pihole_port_mappings:
  - 53:53/udp
  - 53:53/tcp
  - 8080:80/tcp

# Conditional DNS forwarding — route queries for specific domains/TLDs to a
# dedicated upstream instead of Pi-hole's default resolvers. Disabled by
# default: set both variables (typically from inventory) to enable. Write IDN
# TLDs in punycode (A-label) form. Clearing either variable removes the drop-in.
pihole_conditional_forward_server: ""
pihole_conditional_forward_domains: []
